name: ci
on: [push, pull_request]
jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: "22.14.0", cache: npm }
      - run: npm ci
      - run: npm run bangun-token
      - run: npm run periksa
      - run: npm run uji
